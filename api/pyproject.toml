[project]
name = "finance-tracker-api"
version = "0.1.0"
description = "Finance Tracker API built with FastAPI and SQLAlchemy"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.45.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.0.3"]
